      <h1>Nearcast: a scripting language for NEAR</h1>
      <p>Write what should happen onchain in a few readable lines. Nearcast simulates every step against live chain state, shows exactly what will be signed, then runs it from your NEAR wallet, and resumes where it stopped if anything fails. Through NEAR Chain Signatures and NEAR Intents, one NEAR script acts on EVM chains, Bitcoin and Solana.</p>
      <pre>load chainsig

chainsig:on base "payroll" (
  exec @token(USDC) "transfer(address,uint256)" 0xcC50098040cdD7F65f198f3EDF5baB02bC3dfa10 1e6
)
chainsig:transfer solana "payroll" 8xXETPXGab2fEyqhaeGeUkxxFXhGkC5wo8ndNzTikcZj 0.01
chainsig:transfer bitcoin "payroll" tb1qsstasqk8t7qu0d9ywr7khf3nug2jyaszpkrl4d 0.00001</pre>
